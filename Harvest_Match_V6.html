<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#73bb4a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="application-name" content="Harvest Match"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><title>Harvest Match 6</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;font-family:system-ui,"Segoe UI",sans-serif;color:#285027;background:linear-gradient(#83d6ff 0%,#d4f5ff 39%,#a4d977 39%,#68b451 100%);display:flex;justify-content:center}
.app{width:min(100%,520px);padding:12px 12px 26px;text-align:center}.logo{font-size:clamp(30px,8vw,42px);font-weight:1000;color:white;text-shadow:0 4px #358a38,2px 2px #358a38;margin:8px 0 2px}.sub{font-size:13px;font-weight:900;color:#376d34;margin-bottom:12px}
.panel{background:#fff7df;border:4px solid white;border-radius:22px;box-shadow:0 6px 0 #4d933d;padding:13px;margin-bottom:13px}.hidden{display:none!important}
h2{margin:6px 0 12px}p{line-height:1.45}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #2259e7;outline-offset:2px}
.bigbtn,.smallbtn{border:3px solid #fff;border-radius:16px;padding:12px 15px;font-size:17px;font-weight:900;color:white;background:#ee8c34;box-shadow:0 4px 0 #b96b27;margin:5px}.bigbtn{width:90%;max-width:310px}.smallbtn{font-size:14px;padding:9px 10px}.blue{background:#419bd9;box-shadow:0 4px 0 #2579af}.green{background:#66ad4a;box-shadow:0 4px 0 #468535}.purple{background:#9b74d5;box-shadow:0 4px 0 #7650a9}
.mascot{font-size:65px;margin:10px}.levelgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.levelbtn{min-height:74px;border:3px solid #fff;border-radius:14px;background:#a8d77a;color:#2d562b;font-weight:1000;box-shadow:0 3px #599947}.levelbtn.locked{background:#d7d8cb;color:#7a7d71;box-shadow:0 3px #aeb2a4}.stars{font-size:15px;display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#e7f4cf;border-radius:13px;padding:8px 2px;font-size:11px;font-weight:900}.stat strong{display:block;font-size:23px}.goal{font-size:14px;font-weight:900;margin-top:10px}.track{height:12px;background:#d4ddbf;border-radius:30px;overflow:hidden;margin-top:7px}.fill{height:100%;width:0;background:linear-gradient(90deg,#ffbd3a,#f17739);transition:width .2s}
.board{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:7px;background:#559641;border:5px solid #fff0bd;border-radius:20px;box-shadow:0 7px #3e7e31;touch-action:none;user-select:none}.tile{aspect-ratio:1;border:0;border-radius:11px;background:linear-gradient(#ffe9ac,#eec878);box-shadow:inset 0 -4px #d2aa5f,0 2px #447c32;font-size:clamp(23px,7vw,39px);padding:0;display:grid;place-items:center;transition:transform .13s}.tile.selected{outline:3px solid white;background:#fff88c;transform:scale(1.07);z-index:1}.tile.hinted{animation:pulse .6s infinite alternate}.tile.bomb{background:linear-gradient(#ffe3f9,#e3a6e8)}.tile.pop{animation:pop .2s}@keyframes pulse{to{transform:scale(1.12)}}@keyframes pop{50%{transform:scale(1.2)}}
.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;margin:13px 0 6px}.controls .smallbtn{flex:1;min-width:27%;margin:3px;padding:10px 3px;font-size:13px}
.message{min-height:35px;font-weight:900;padding:9px 3px;font-size:14px}.foot{font-size:11px;font-weight:800;margin-top:13px}.overlay{position:fixed;inset:0;background:#193d24cb;display:none;align-items:center;justify-content:center;padding:15px;z-index:10}.overlay.show{display:flex}.modal{width:min(100%,380px);background:#fff7df;border:5px solid white;border-radius:25px;box-shadow:0 9px #397e37;padding:22px;text-align:center}.modal h2{font-size:27px}.modal .bigbtn{width:100%}
@media(max-width:360px){.tile{border-radius:7px}.board{gap:3px;padding:5px}.controls .smallbtn{font-size:11px}}
body{overscroll-behavior-y:contain} .app{padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(26px,env(safe-area-inset-bottom))} .tile:active{transform:scale(.94)} @media(display-mode:standalone){.foot{opacity:.8}} #splash{position:fixed;inset:0;z-index:20;background:linear-gradient(#8bdcff,#8dd16c);display:grid;place-items:center;text-align:center;transition:opacity .4s;pointer-events:none}#splash.off{opacity:0}#splash .splashinner{font-weight:1000;color:white;text-shadow:0 3px #398537;font-size:34px}#splash .splashinner span{display:block;font-size:90px} </style></head><body><div id="splash" aria-hidden="true"><div class="splashinner"><span>🌻🚜</span>Harvest Match</div></div><main class="app">
<div class="logo">🌻 Harvest Match</div><div class="sub">FARM FRESH FUN · VERSION 6</div>
<section id="home" class="panel"><div class="mascot">🚜🌾</div><h2>Welcome to the Farm!</h2><p>Swap crops, create big combos, and harvest your way through 30 fields.</p><button class="bigbtn green" id="play">▶ Play</button><button class="bigbtn blue" id="levels">🗺️ Choose Level</button><button class="bigbtn purple" id="homeSound">🔊 Sound On</button><p id="homeProgress"></p></section>
<section id="levelScreen" class="panel hidden"><h2>🗺️ Farm Fields</h2><p>Earn stars to unlock new fields!</p><div id="levelGrid" class="levelgrid"></div><button class="bigbtn blue" id="levelBack">← Main Menu</button></section>
<section id="game" class="hidden">
<div class="panel"><div class="stats"><div class="stat">LEVEL<strong id="level">1</strong></div><div class="stat">SCORE<strong id="score">0</strong></div><div class="stat">MOVES<strong id="moves">20</strong></div></div><div class="goal" id="goal"></div><div class="track"><div class="fill" id="progress"></div></div></div>
<div class="board" id="board" aria-label="Harvest Match board"></div>
<div class="controls"><button class="smallbtn" id="hint">💡 Hint</button><button class="smallbtn blue" id="shuffle">🔀 Mix</button><button class="smallbtn purple" id="booster">💥 Booster <span id="boostCount"></span></button><button class="smallbtn green" id="menu">🏠 Menu</button><button class="smallbtn blue" id="sound">🔊 Sound</button></div>
<div class="message" id="message" aria-live="polite"></div></section>
<div class="foot">Free to play • No forced ads • No purchases • Offline play</div></main>
<div class="overlay" id="overlay"><div class="modal"><h2 id="modalTitle"></h2><p id="modalText"></p><button class="bigbtn green" id="modalNext">Continue</button><button class="bigbtn blue" id="modalMenu">Main Menu</button></div></div>
<script>
(()=>{'use strict';
const N=7,SIZE=49,CROPS=['🍓','🥕','🌽','🫐','🍎','🍇'],KEY='harvestMatchV5';
const $=id=>document.getElementById(id);
let data={unlocked:1,stars:{},current:1,score:0,moves:20,board:[],boosters:3,sound:true},selected=-1,locked=false,hintIndex=-1,boosterMode=false,screen='home',audio=null,run=0;
try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&typeof d==='object'){data={...data,...d};data.unlocked=Math.max(1,Math.min(30,Number(data.unlocked)||1));data.current=Math.max(1,Math.min(data.unlocked,Number(data.current)||1));data.stars=data.stars&&typeof data.stars==='object'?data.stars:{};data.boosters=Math.max(0,Math.min(100,Number(data.boosters)||0));}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}}
const rand=()=>Math.floor(Math.random()*6),goal=()=>450+data.current*175,limit=()=>Math.max(17,23-Math.floor(data.current/5)),adj=(a,b)=>a>=0&&b>=0&&a<SIZE&&b<SIZE&&Math.abs(Math.floor(a/N)-Math.floor(b/N))+Math.abs(a%N-b%N)===1;
function groups(){const out=[];for(let r=0;r<N;r++){let c=0;while(c<N){let s=c,v=data.board[r*N+c];if(v==null||v<0){c++;continue}while(c<N&&data.board[r*N+c]===v)c++;if(c-s>=3)out.push(Array.from({length:c-s},(_,k)=>r*N+s+k));}}for(let c=0;c<N;c++){let r=0;while(r<N){let s=r,v=data.board[r*N+c];if(v==null||v<0){r++;continue}while(r<N&&data.board[r*N+c]===v)r++;if(r-s>=3)out.push(Array.from({length:r-s},(_,k)=>(s+k)*N+c));}}return out;}
function possible(){for(let i=0;i<SIZE;i++)for(const j of [i+1,i+N]){if(!adj(i,j))continue;[data.board[i],data.board[j]]=[data.board[j],data.board[i]];const ok=groups().length>0;[data.board[i],data.board[j]]=[data.board[j],data.board[i]];if(ok)return[i,j];}return null;}
function fresh(){for(let k=0;k<1500;k++){data.board=Array.from({length:SIZE},rand);if(!groups().length&&possible())return;}data.board=Array.from({length:SIZE},rand);}
function sound(freq=560){if(!data.sound)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audio)audio=new AC();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(.055,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.13);o.start();o.stop(audio.currentTime+.14);}catch(e){}}
function show(which){screen=which;for(const id of ['home','levelScreen','game'])$(id).classList.toggle('hidden',id!==which);if(which==='home'){$('homeProgress').textContent='Fields unlocked: '+data.unlocked+' / 30';$('homeSound').textContent=data.sound?'🔊 Sound On':'🔇 Sound Off';}if(which==='levelScreen')renderLevels();if(which==='game')render();}
function renderLevels(){const grid=$('levelGrid');grid.replaceChildren();for(let i=1;i<=30;i++){const b=document.createElement('button');b.className='levelbtn'+(i>data.unlocked?' locked':'');b.disabled=i>data.unlocked;b.innerHTML='<span>'+(i>data.unlocked?'🔒':i)+'</span><span class="stars">'+(i>data.unlocked?'Locked':'⭐'.repeat(data.stars[i]||0)||'☆ ☆ ☆')+'</span>';b.onclick=()=>start(i);grid.appendChild(b);}}
function start(n){run++;data.current=n;data.score=0;data.moves=limit();data.boosters=Math.max(data.boosters,1);fresh();selected=-1;hintIndex=-1;boosterMode=false;locked=false;save();show('game');say('Match 3 crops! Match 4+ for a bonus.');}
function render(){if(screen!=='game')return;const b=$('board');b.replaceChildren();data.board.forEach((v,i)=>{const el=document.createElement('button');el.className='tile'+(selected===i?' selected':'')+(hintIndex===i?' hinted':'');el.textContent=CROPS[v]||'🌱';el.setAttribute('aria-label',(CROPS[v]||'crop')+' row '+(Math.floor(i/N)+1)+' column '+(i%N+1));el.onclick=()=>pick(i);let sx=0,sy=0;el.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});el.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>25){e.preventDefault();e.stopPropagation();const j=i+(Math.abs(dx)>Math.abs(dy)?(dx>0?1:-1):(dy>0?N:-N));if(adj(i,j))swap(i,j);}},{passive:false});b.appendChild(el);});$('level').textContent=data.current;$('score').textContent=data.score;$('moves').textContent=data.moves;$('goal').textContent='Harvest '+goal()+' points';$('progress').style.width=Math.min(100,100*data.score/goal())+'%';$('boostCount').textContent='('+data.boosters+')';$('sound').textContent=data.sound?'🔊 Sound':'🔇 Muted';save();}
function say(t){$('message').textContent=t;}
function pick(i){if(locked||screen!=='game')return;if(boosterMode){boosterMode=false;if(data.boosters<1)return;data.boosters--;data.moves=Math.max(0,data.moves-1);locked=true;let hit=new Set([i]);const r=Math.floor(i/N),c=i%N;for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){if(r+dr>=0&&r+dr<N&&c+dc>=0&&c+dc<N)hit.add((r+dr)*N+c+dc);}data.score+=hit.size*55;remove(hit);sound(750);cascade(1,run);return;}
if(selected===i){selected=-1;render();return}if(selected<0){selected=i;render();return}if(adj(selected,i)){const a=selected;selected=-1;swap(a,i);}else{selected=i;render();}}
function swap(a,b){if(locked||screen!=='game'||data.moves<=0)return;hintIndex=-1;[data.board[a],data.board[b]]=[data.board[b],data.board[a]];if(!groups().length){[data.board[a],data.board[b]]=[data.board[b],data.board[a]];selected=-1;render();say('Try another swap to match 3!');return;}selected=-1;data.moves--;locked=true;cascade(1,run);}
function remove(hit){for(const i of hit)data.board[i]=-1;for(let c=0;c<N;c++){const values=[];for(let r=N-1;r>=0;r--)if(data.board[r*N+c]>=0)values.push(data.board[r*N+c]);for(let r=N-1;r>=0;r--)data.board[r*N+c]=values[N-1-r]??rand();}}
function cascade(chain,token){if(token!==run)return;const found=groups();if(!found.length){locked=false;if(data.score>=goal()){finish(true);return;}if(data.moves<=0){finish(false);return;}if(!possible()){fresh();say('Fresh crops shuffled in!');}else say(chain>2?'Amazing crop combo! 🌟':'Nice harvest! 🌾');render();return;}
const hit=new Set(found.flat()),bonus=found.filter(g=>g.length>=4).length*90;data.score+=hit.size*50*chain+bonus;remove(hit);sound(470+chain*100);render();setTimeout(()=>cascade(chain+1,token),210);}
function finish(win){locked=true;const stars=win?(data.moves>=8?3:data.moves>=3?2:1):0;if(win){data.stars[data.current]=Math.max(data.stars[data.current]||0,stars);data.unlocked=Math.min(30,Math.max(data.unlocked,data.current+1));data.boosters=Math.min(20,data.boosters+1);}
save();$('overlay').classList.add('show');$('modalTitle').textContent=win?'🎉 Field Complete!':'🌱 Out of Moves';$('modalText').textContent=win?('You earned '+ '⭐'.repeat(stars)+' and scored '+data.score+' points! You also earned 1 booster.'):('You scored '+data.score+' points. Give this field another try!');$('modalNext').textContent=win&&data.current<30?'Next Field ➜':win?'Play Again':'Retry Field';$('modalNext').onclick=()=>{closeModal();start(win&&data.current<30?data.current+1:data.current);};}
function closeModal(){$('overlay').classList.remove('show');}
$('play').onclick=()=>{if(Array.isArray(data.board)&&data.board.length===SIZE&&data.moves>0&&data.score<goal()&&!groups().length&&possible()){locked=false;show('game');say('Welcome back to your farm!');}else start(data.current);};
$('levels').onclick=()=>show('levelScreen');$('levelBack').onclick=()=>show('home');$('menu').onclick=()=>{run++;locked=false;save();show('home');};$('modalMenu').onclick=()=>{closeModal();run++;show('home');};
$('hint').onclick=()=>{if(locked)return;const p=possible();if(!p){fresh();say('Fresh crops shuffled in!');}else{hintIndex=p[0];say('Swap the glowing crop with a neighbor!');}render();};
$('shuffle').onclick=()=>{if(locked)return;fresh();selected=-1;hintIndex=-1;render();say('Fresh field! 🌻');};
$('booster').onclick=()=>{if(locked)return;if(data.boosters<1){say('No boosters left. Earn one by finishing a field!');return;}boosterMode=!boosterMode;say(boosterMode?'💥 Tap a crop to clear it and its neighbors (uses 1 move).':'Booster canceled.');};
function toggleSound(){data.sound=!data.sound;save();if(screen==='home')show('home');else render();}
$('sound').onclick=toggleSound;$('homeSound').onclick=toggleSound;
if(!Array.isArray(data.board)||data.board.length!==SIZE||data.board.some(v=>!Number.isInteger(v)||v<0||v>5)){fresh();data.moves=limit();data.score=0;}show('home');
})();
</script><script>window.addEventListener('load',()=>{setTimeout(()=>{const s=document.getElementById('splash');s.classList.add('off');setTimeout(()=>s.remove(),450)},650);if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});});</script></body></html>
